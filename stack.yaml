apiVersion: v1
kind: Namespace
metadata:
  name: cache-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-backend
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-backend}
  template:
    metadata:
      labels: {app: mock-backend}
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-backend
  namespace: cache-e2e
spec:
  selector: {app: mock-backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine3.23
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: cache-e2e
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cache-e2e
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: skipper-local
        static_configs:
          - targets: ['host.minikube.internal:9911']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cache-e2e
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cache-e2e
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Cache verification
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cache-e2e
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.3.0
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 2
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboard
          configMap: {name: cache-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cache-e2e
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
