apiVersion: v1
kind: Namespace
metadata:
  name: cache-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-backend
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-backend}
  template:
    metadata:
      labels: {app: mock-backend}
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-backend
  namespace: cache-e2e
spec:
  selector: {app: mock-backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine3.23
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: cache-e2e
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cache-e2e
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: skipper-local
        static_configs:
          - targets: ['host.minikube.internal:9911']
            labels: {run_id: local}
      - job_name: mock-origin
        static_configs:
          - targets: ['host.minikube.internal:9091']
            labels: {run_id: local}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cache-e2e
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cache-e2e
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cache-e2e
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Cache verification
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cache-e2e
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: local-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: local-loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000
      - name: Tempo
        uid: local-tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        jsonData:
          # Grafana 11.3 enables TraceQL streaming by default; the streamed search path returns
          # "unsupported query type: 'traceql'" from the bundled backend. Plain search works.
          streamingEnabled: {search: false, metrics: false}
          tracesToLogsV2:
            datasourceUid: local-loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
            filterBySpanID: false
            customQuery: true
            query: '{job="skipper"} |= "$${__trace.traceId}"'
          nodeGraph:
            enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cache-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 2
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboard
          configMap: {name: cache-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cache-e2e
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: cache-e2e
data:
  loki.json: |
    {
      "auth_enabled": false,
      "analytics": {"reporting_enabled": false},
      "server": {"http_listen_port": 3100, "grpc_listen_port": 9096},
      "common": {
        "instance_addr": "127.0.0.1",
        "path_prefix": "/var/loki",
        "replication_factor": 1,
        "ring": {"kvstore": {"store": "inmemory"}},
        "storage": {"filesystem": {"chunks_directory": "/var/loki/chunks", "rules_directory": "/var/loki/rules"}}
      },
      "schema_config": {
        "configs": [{"from": "2024-01-01", "store": "tsdb", "object_store": "filesystem", "schema": "v13",
                     "index": {"prefix": "index_", "period": "24h"}}]
      },
      "compactor": {
        "working_directory": "/var/loki/compactor",
        "retention_enabled": true,
        "delete_request_store": "filesystem",
        "retention_delete_delay": "2h",
        "retention_delete_worker_count": 1
      },
      "limits_config": {
        "retention_period": "168h",
        "allow_structured_metadata": true,
        "ingestion_rate_mb": 16,
        "ingestion_burst_size_mb": 32,
        "max_global_streams_per_user": 1000,
        "max_query_parallelism": 2,
        "max_query_length": "168h",
        "max_entries_limit_per_query": 5000
      },
      "query_range": {"parallelise_shardable_queries": false}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: cache-e2e
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.json"]
          ports: [{containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 2
            initialDelaySeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /var/loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: cache-e2e
spec:
  selector: {app: loki}
  ports: [{port: 3100, targetPort: 3100}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: cache-e2e
data:
  tempo.json: |
    {
      "usage_report": {"reporting_enabled": false},
      "server": {"http_listen_port": 3200},
      "distributor": {
        "receivers": {"otlp": {"protocols": {"http": {"endpoint": "0.0.0.0:4318"}}}}
      },
      "ingester": {"trace_idle_period": "10s", "max_block_duration": "5m", "max_block_bytes": 67108864},
      "compactor": {"compaction": {"block_retention": "168h"}},
      "storage": {
        "trace": {
          "backend": "local",
          "wal": {"path": "/var/tempo/wal"},
          "local": {"path": "/var/tempo/blocks"},
          "pool": {"max_workers": 4, "queue_depth": 100}
        }
      },
      "overrides": {
        "defaults": {
          "ingestion": {"rate_limit_bytes": 4194304, "burst_size_bytes": 8388608, "max_traces_per_user": 10000},
          "global": {"max_bytes_per_trace": 2097152}
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: cache-e2e
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.json"]
          ports:
            - {containerPort: 3200}
            - {containerPort: 4318}
            - {containerPort: 9095}
          readinessProbe:
            httpGet: {path: /ready, port: 3200}
            periodSeconds: 2
            initialDelaySeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          persistentVolumeClaim: {claimName: tempo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: cache-e2e
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200, targetPort: 3200}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: grpc, port: 9095, targetPort: 9095}
